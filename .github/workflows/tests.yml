name: tests
on: [push, pull_request]
jobs:
  data-and-scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: finqa-${{ hashFiles('data/manifest.json') }}
      - run: pip install -r requirements.txt
      - run: python -m finqa_lora.fetch
      - run: pytest
  model-code:
    # Prompt, inference and LoRA training on a tiny random-weight model, CPU only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: finqa-${{ hashFiles('data/manifest.json') }}
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-gpu.txt
      - run: python -m finqa_lora.fetch
      - run: pytest tests/test_model_code.py tests/test_prompt.py
